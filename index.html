<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Saída</title>
  <link rel="stylesheet" href="jogoSemSaida.css">
</head>
<body>
  <main class="painel">
    <h1>Sem Saída</h1>
    <p class="subtitulo">Colete o dinheiro, fuja da polícia e use as bombinhas!</p>
    <section class="placar" aria-live="polite">
      <span>Pontuação: <strong id="pontuacao">0</strong></span>
      <span>Fase: <strong id="fase">1</strong></span>
      <span>Vidas: <strong id="vidas">3</strong></span>
      <span>Bolsas: <strong id="bolsas">0</strong></span>
    </section>
    <canvas id="jogo" width="600" height="600" aria-label="Jogo Sem Saída"></canvas>
    <p class="instrucoes">Movimente com as setas ou WASD. Pegue 💣 para desnortear os policiais por alguns segundos.</p>
    <p id="mensagem" role="status">Pressione uma seta ou WASD para começar.</p>
    <button id="reiniciar" type="button">Reiniciar jogo</button>
  </main>
  <script src="jogoSemSaida.js"></script>
</body>
</html>
